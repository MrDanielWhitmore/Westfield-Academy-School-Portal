<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173b72">
<title>Westfield Academy | School Portal</title>
<style>
:root{--navy:#173b72;--navy2:#10294f;--blue:#2f65b0;--pale:#eef4fc;--ink:#17243a;--muted:#68778d;--line:#e1e7ef;--white:#fff;--green:#16845b;--red:#c33e48;--amber:#a96809}
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{background:linear-gradient(120deg,var(--navy2),var(--navy));color:#fff;padding:18px max(18px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;box-shadow:0 3px 12px #10294f22}.brand{display:flex;gap:12px;align-items:center}.crest{width:43px;height:48px;border:2px solid #d9e7ff;border-radius:9px 9px 14px 14px;display:grid;place-items:center;font-weight:900;letter-spacing:-1px;color:#fff;background:#ffffff14}.brand h1{font-size:17px;margin:0;letter-spacing:.2px}.brand small{display:block;color:#d9e6fa;font-size:12px;margin-top:2px}.role{font-size:12px;border:1px solid #ffffff65;border-radius:99px;padding:7px 10px;white-space:nowrap}.layout{max-width:1280px;margin:auto;display:grid;grid-template-columns:225px 1fr;min-height:calc(100vh - 84px)}.sidebar{padding:20px 12px;border-right:1px solid var(--line);background:#fff}.navbtn{display:flex;width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;color:#4c5a70;gap:11px;align-items:center;margin-bottom:4px}.navbtn .ico{width:22px;text-align:center}.navbtn.active,.navbtn:hover{background:var(--pale);color:var(--navy);font-weight:700}.side-note{margin:22px 7px 0;padding:13px;border-radius:10px;background:#f7f9fc;color:var(--muted);font-size:12px}.main{padding:25px;min-width:0}.pagehead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:22px}.pagehead h2{margin:0;font-size:25px;letter-spacing:-.5px}.pagehead p{margin:5px 0 0;color:var(--muted)}.btn{border:0;border-radius:9px;background:var(--navy);color:#fff;padding:10px 14px;font-weight:650}.btn.secondary{background:#edf2f9;color:var(--navy)}.btn.danger{background:#fff0f1;color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:19px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 7px #17243a05}.stat{padding:17px}.stat .label{color:var(--muted);font-size:12px}.stat .number{font-size:28px;font-weight:800;margin-top:5px;letter-spacing:-.7px}.stat .sub{font-size:12px;color:var(--muted);margin-top:4px}.panel{padding:18px;margin-bottom:17px}.panel h3{margin:0 0 13px;font-size:16px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.quick{display:flex;gap:9px;flex-wrap:wrap}.quick button{flex:1;min-width:130px;text-align:left;padding:13px;background:#f7f9fc;color:var(--navy);border:1px solid var(--line);border-radius:10px;font-weight:650}.quick span{display:block;font-size:21px;margin-bottom:7px}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:99px;padding:4px 8px;font-size:12px;font-weight:700;background:#edf2f8;color:#536278}.pill.green{background:#e6f6ef;color:var(--green)}.pill.red{background:#fff0f1;color:var(--red)}.pill.amber{background:#fff4df;color:var(--amber)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select{flex:1;min-width:150px}.field, input, select, textarea{border:1px solid #d7e0eb;border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink);width:100%;min-width:0}.field:focus,input:focus,select:focus,textarea:focus{outline:2px solid #9bbce8;border-color:#5b8fd2}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:580px;background:#fff}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}th{background:#f7f9fc;color:#627086;font-size:11px;text-transform:uppercase;letter-spacing:.5px}tr:last-child td{border-bottom:0}.empty{padding:25px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid label{font-size:12px;font-weight:700;color:#536278;display:flex;flex-direction:column;gap:6px}.formgrid .wide{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.notice{padding:12px 14px;background:#fff7e6;border:1px solid #f3dfb2;color:#80550b;border-radius:10px;font-size:13px;margin-bottom:17px}.listrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.avatar{width:37px;height:37px;border-radius:11px;background:#eaf1fc;color:var(--navy);font-weight:800;display:grid;place-items:center;flex-shrink:0}.person{display:flex;align-items:center;gap:10px}.person strong{display:block;font-size:13px}.person small{display:block;color:var(--muted);font-size:12px}.mobilebar{display:none}.footer{font-size:12px;color:var(--muted);text-align:center;padding:20px 0 5px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#17243a;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px #0002;z-index:20;max-width:90vw}.hidden{display:none!important}
@media(max-width:800px){.layout{display:block}.sidebar{display:none}.main{padding:18px 14px 95px}.topbar{padding:13px 14px}.brand h1{font-size:15px}.role{font-size:11px;padding:6px 8px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:13px}.stat .number{font-size:25px}.two{grid-template-columns:1fr}.pagehead h2{font-size:22px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -5px 20px #10294f0a}.mobilebar button{border:0;background:transparent;color:#617087;font-size:10px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;flex:1}.mobilebar button span{font-size:19px}.mobilebar button.active{color:var(--navy);font-weight:800}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.toolbar input,.toolbar select{min-width:100%}.pagehead .btn{padding:9px 10px;font-size:12px}.panel{padding:14px}.quick button{min-width:calc(50% - 6px)}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="crest">WA</div><div><h1>Westfield Academy</h1><small>School Management Portal</small></div></div><div class="role">HEADTEACHER ▾</div></header>
<div class="layout"><aside class="sidebar" id="sidebar"></aside><main class="main" id="main"></main></div>
<nav class="mobilebar" id="mobilebar"></nav>
</div>
<div id="toast" class="toast hidden"></div>
<script>
const navItems=[
['dashboard','⌂','Dashboard'],['students','♙','Students'],['attendance','✓','Attendance'],['timetable','▦','Timetable'],['behaviour','⚑','Behaviour'],['staff','♧','Staff accounts'],['grades','★','Grades & reports'],['parents','♧','Parent accounts']
];
const seed={
students:[
{id:1001,name:'Amelia Carter',year:'Year 7',class:'7A',status:'Active'},
{id:1002,name:'Noah Williams',year:'Year 7',class:'7B',status:'Active'},
{id:1003,name:'Olivia Thompson',year:'Year 8',class:'8A',status:'Active'},
{id:1004,name:'Oliver Patel',year:'Year 8',class:'8B',status:'Active'},
{id:1005,name:'Isla Robinson',year:'Year 9',class:'9A',status:'Active'}
],
attendance:[],timetable:[
{id:1,day:'Monday',time:'09:00',subject:'English',class:'7A',teacher:'Ms Bennett',room:'Room 12'},
{id:2,day:'Monday',time:'10:00',subject:'Mathematics',class:'7A',teacher:'Mr Khan',room:'Room 8'},
{id:3,day:'Monday',time:'11:15',subject:'Science',class:'8A',teacher:'Dr Lewis',room:'Lab 2'},
{id:4,day:'Tuesday',time:'09:00',subject:'History',class:'9A',teacher:'Mrs Green',room:'Room 16'}
],
behaviour:[{id:1,student:'Noah Williams',type:'Positive',detail:'Helped a classmate',date:'2026-10-21'}],
staff:[{id:1,name:'Alex Morgan',role:'Headteacher',email:'headteacher@westfield.example'},{id:2,name:'Sarah Bennett',role:'Teacher',email:'s.bennett@westfield.example'}],
grades:[{id:1,student:'Amelia Carter',subject:'English',grade:'B',report:'Good effort and thoughtful contributions.'},{id:2,student:'Noah Williams',subject:'Mathematics',grade:'A',report:'Excellent understanding of the current topic.'}],
parents:[{id:1,name:'Taylor Carter',student:'Amelia Carter',email:'parent1@example.test'}]
};
let data;try{data=JSON.parse(localStorage.getItem('westfieldRoleplayData'))||structuredClone(seed)}catch(e){data=JSON.parse(JSON.stringify(seed))}
let current='dashboard';
function save(){localStorage.setItem('westfieldRoleplayData',JSON.stringify(data))}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2400)}
function go(page){current=page;render()}
function navHtml(mobile=false){return navItems.map(([id,ico,label])=>mobile?`<button class="${current===id?'active':''}" onclick="go('${id}')"><span>${ico}</span>${label.split(' ')[0]}</button>`:`<button class="navbtn ${current===id?'active':''}" onclick="go('${id}')"><span class="ico">${ico}</span>${label}</button>`).join('')}
function header(title,desc,button=''){return `<div class="pagehead"><div><h2>${title}</h2><p>${desc}</p></div>${button}</div>`}
function stat(label,num,sub,ico){return `<div class="stat"><div class="label">${ico} &nbsp;${label}</div><div class="number">${num}</div><div class="sub">${sub}</div></div>`}
function panel(title,body){return `<section class="panel"><h3>${title}</h3>${body}</section>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">Nothing here yet. Add a record to get started.</td></tr>`}</tbody></table></div>`}
function initials(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function dashboard(){let today=new Date().toISOString().slice(0,10),marked=data.attendance.filter(x=>x.date===today),present=marked.filter(x=>x.status==='Present').length,rate=marked.length?Math.round(present/marked.length*100):0;
return header('Good afternoon, Headteacher','Here is the current overview for Westfield Academy.',`<button class="btn" onclick="go('students')">＋ Add student</button>`)+`<div class="notice">Roleplay demo only — use fictional names and details. Records are saved in this browser on this device, not securely shared with other accounts.</div><div class="stats">${stat('Students',data.students.length,'Enrolled in the demo','♙')}${stat('Staff accounts',data.staff.length,'Demo staff profiles','♧')}${stat('Attendance today',marked.length?rate+'%':'—',marked.length?`${present} present out of ${marked.length} marked`:'No registers marked yet','✓')}${stat('Behaviour records',data.behaviour.length,'Positive and concern logs','⚑')}</div><div class="two"><div>${panel('Quick actions',`<div class="quick"><button onclick="go('attendance')"><span>✓</span>Take attendance</button><button onclick="go('timetable')"><span>▦</span>View timetable</button><button onclick="go('behaviour')"><span>⚑</span>Log behaviour</button><button onclick="go('grades')"><span>★</span>Enter grades</button></div>`)}${panel('Recently added students',data.students.slice(-3).reverse().map(s=>`<div class="listrow"><div class="person"><div class="avatar">${initials(s.name)}</div><div><strong>${esc(s.name)}</strong><small>${esc(s.year)} · ${esc(s.class)}</small></div></div><span class="pill green">${esc(s.status)}</span></div>`).join('')||'<p class="muted">No students yet.</p>')}</div><div>${panel('Today at a glance',`<div class="listrow"><span>Students on roll</span><strong>${data.students.length}</strong></div><div class="listrow"><span>Attendance entries today</span><strong>${marked.length}</strong></div><div class="listrow"><span>Timetable periods</span><strong>${data.timetable.length}</strong></div><div class="listrow"><span>Reports recorded</span><strong>${data.grades.length}</strong></div>`)}${panel('Roleplay reminder',`<p class="muted">This is a front-end prototype inspired by school MIS layouts. It does not send emails, authenticate users, or provide real safeguarding or student-record security.</p><button class="btn secondary" onclick="exportData()">Export demo data</button> <button class="btn secondary" onclick="resetData()">Reset demo</button>`)}</div></div>`}
function students(){return header('Students','Manage your fictional student register.',`<button class="btn" onclick="studentForm()">＋ Add student</button>`)+`<div class="toolbar"><input id="studentSearch" placeholder="Search students…" oninput="filterStudents()"><select id="yearFilter" onchange="filterStudents()"><option value="">All year groups</option>${[7,8,9,10,11,12,13].map(y=>`<option>Year ${y}</option>`).join('')}</select></div><div id="studentTable">${studentTable(data.students)}</div><div id="studentEditor"></div>`}
function studentTable(list){return table(['Student','Year','Form','Status','Actions'],list.map(s=>`<tr><td><div class="person"><div class="avatar">${initials(s.name)}</div><strong>${esc(s.name)}</strong></div></td><td>${esc(s.year)}</td><td>${esc(s.class)}</td><td><span class="pill green">${esc(s.status)}</span></td><td><button class="btn secondary" onclick="editStudent(${s.id})">Edit</button> <button class="btn danger" onclick="removeItem('students',${s.id})">Delete</button></td></tr>`))}
function filterStudents(){let q=document.getElementById('studentSearch').value.toLowerCase(),y=document.getElementById('yearFilter').value;document.getElementById('studentTable').innerHTML=studentTable(data.students.filter(s=>s.name.toLowerCase().includes(q)&&(!y||s.year===y)))}
function studentForm(s=null){document.getElementById('studentEditor').innerHTML=panel(s?'Edit student':'Add student',`<form onsubmit="saveStudent(event,${s?s.id:'null'})"><div class="formgrid"><label>Full name<input name="name" required value="${esc(s?.name||'')}" placeholder="e.g. Jamie Taylor"></label><label>Year group<select name="year">${[7,8,9,10,11,12,13].map(y=>`<option ${s?.year===`Year ${y}`?'selected':''}>Year ${y}</option>`).join('')}</select></label><label>Form class<input name="class" required value="${esc(s?.class||'7A')}" placeholder="e.g. 7A"></label><label>Status<select name="status"><option ${!s||s.status==='Active'?'selected':''}>Active</option><option ${s?.status==='Inactive'?'selected':''}>Inactive</option></select></label></div><div class="actions"><button type="button" class="btn secondary" onclick="document.getElementById('studentEditor').innerHTML=''">Cancel</button><button class="btn">Save student</button></div></form>`);document.getElementById('studentEditor').scrollIntoView({behavior:'smooth',block:'start'})}
function editStudent(id){studentForm(data.students.find(s=>s.id===id))}
function saveStudent(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(id){Object.assign(data.students.find(s=>s.id===id),f)}else data.students.push({id:Date.now(),...f});save();render();toast('Student saved')}
function attendance(){let today=new Date().toISOString().slice(0,10);return header('Attendance','Mark the register for a date and review the records.')+`<section class="panel"><form onsubmit="markAttendance(event)"><div class="formgrid"><label>Date<input type="date" name="date" value="${today}" required></label><label>Class<select name="class">${['All classes',...new Set(data.students.map(s=>s.class))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><label class="wide">Register status<p class="muted" style="margin:0">Choose Present, Absent or Late for each student shown below.</p></label></div><div id="registerList" style="margin-top:10px">${registerInputs()}</div><div class="actions"><button class="btn">Save register</button></div></form></section>`+panel('Recent attendance records',table(['Date','Student','Class','Status'],data.attendance.slice().reverse().slice(0,30).map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.student)}</td><td>${esc(a.class)}</td><td><span class="pill ${a.status==='Present'?'green':a.status==='Absent'?'red':'amber'}">${esc(a.status)}</span></td></tr>`)))}
function registerInputs(){return data.students.map(s=>`<div class="listrow"><div class="person"><div class="avatar">${initials(s.name)}</div><div><strong>${esc(s.name)}</strong><small>${esc(s.class)} · ${esc(s.year)}</small></div></div><select name="status_${s.id}" style="width:125px"><option>Present</option><option>Absent</option><option>Late</option></select></div>`).join('')||'<p class="muted">Add students before taking attendance.</p>'}
function markAttendance(e){e.preventDefault();let fd=new FormData(e.target),date=fd.get('date'),cl=fd.get('class');data.attendance=data.attendance.filter(a=>!(a.date===date&&(cl==='All classes'||a.class===cl)));data.students.filter(s=>cl==='All classes'||s.class===cl).forEach(s=>data.attendance.push({id:Date.now()+s.id,date,student:s.name,class:s.class,status:fd.get('status_'+s.id)||'Present'}));save();render();toast('Attendance register saved')}
function timetable(){return header('Timetable','View and manage sample lessons.',`<button class="btn" onclick="timetableForm()">＋ Add lesson</button>`)+panel('Weekly timetable',`<div class="toolbar"><select id="dayFilter" onchange="filterTimetable()"><option value="">All days</option>${['Monday','Tuesday','Wednesday','Thursday','Friday'].map(d=>`<option>${d}</option>`).join('')}</select><input id="ttSearch" placeholder="Search subject, class or teacher…" oninput="filterTimetable()"></div><div id="ttTable">${ttTable(data.timetable)}</div><div id="ttEditor"></div>`)}
function ttTable(list){return table(['Day','Time','Subject','Class','Teacher','Room',''],list.slice().sort((a,b)=>['Monday','Tuesday','Wednesday','Thursday','Friday'].indexOf(a.day)-['Monday','Tuesday','Wednesday','Thursday','Friday'].indexOf(b.day)||a.time.localeCompare(b.time)).map(t=>`<tr><td>${esc(t.day)}</td><td>${esc(t.time)}</td><td><strong>${esc(t.subject)}</strong></td><td>${esc(t.class)}</td><td>${esc(t.teacher)}</td><td>${esc(t.room)}</td><td><button class="btn danger" onclick="removeItem('timetable',${t.id})">Delete</button></td></tr>`))}
function filterTimetable(){let d=document.getElementById('dayFilter').value,q=document.getElementById('ttSearch').value.toLowerCase();document.getElementById('ttTable').innerHTML=ttTable(data.timetable.filter(t=>(!d||t.day===d)&&[t.subject,t.class,t.teacher,t.room].some(v=>v.toLowerCase().includes(q))))}
function timetableForm(){document.getElementById('ttEditor').innerHTML=panel('Add lesson',`<form onsubmit="saveTimetable(event)"><div class="formgrid"><label>Day<select name="day">${['Monday','Tuesday','Wednesday','Thursday','Friday'].map(d=>`<option>${d}</option>`).join('')}</select></label><label>Time<input type="time" name="time" value="09:00" required></label><label>Subject<input name="subject" required></label><label>Class<input name="class" value="7A" required></label><label>Teacher<input name="teacher" required></label><label>Room<input name="room" value="Room 1" required></label></div><div class="actions"><button class="btn secondary" type="button" onclick="document.getElementById('ttEditor').innerHTML=''">Cancel</button><button class="btn">Save lesson</button></div></form>`)}
function saveTimetable(e){e.preventDefault();data.timetable.push({id:Date.now(),...Object.fromEntries(new FormData(e.target))});save();render();toast('Lesson saved')}
function behaviour(){return header('Behaviour','Record positive recognition and behaviour concerns.',`<button class="btn" onclick="behaviourForm()">＋ New record</button>`)+panel('Behaviour log',table(['Date','Student','Type','Details',''],data.behaviour.slice().reverse().map(b=>`<tr><td>${esc(b.date)}</td><td>${esc(b.student)}</td><td><span class="pill ${b.type==='Positive'?'green':'amber'}">${esc(b.type)}</span></td><td>${esc(b.detail)}</td><td><button class="btn danger" onclick="removeItem('behaviour',${b.id})">Delete</button></td></tr>`)))+`<div id="behaviourEditor"></div>`}
function behaviourForm(){document.getElementById('behaviourEditor').innerHTML=panel('New behaviour record',`<form onsubmit="saveBehaviour(event)"><div class="formgrid"><label>Student<select name="student" required>${data.students.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></label><label>Type<select name="type"><option>Positive</option><option>Concern</option><option>Detention</option><option>Achievement</option></select></label><label>Date<input type="date" name="date" value="${new Date().toISOString().slice(0,10)}" required></label><label class="wide">Details<textarea name="detail" rows="3" required placeholder="Keep roleplay notes respectful and factual."></textarea></label></div><div class="actions"><button class="btn secondary" type="button" onclick="document.getElementById('behaviourEditor').innerHTML=''">Cancel</button><button class="btn">Save record</button></div></form>`)}
function saveBehaviour(e){e.preventDefault();data.behaviour.push({id:Date.now(),...Object.fromEntries(new FormData(e.target))});save();render();toast('Behaviour record saved')}
function staff(){return header('Staff accounts','Manage demo staff profiles and role labels.',`<button class="btn" onclick="staffForm()">＋ Add staff</button>`)+panel('Staff directory',table(['Staff member','Role','Email',''],data.staff.map(s=>`<tr><td><div class="person"><div class="avatar">${initials(s.name)}</div><strong>${esc(s.name)}</strong></div></td><td>${esc(s.role)}</td><td>${esc(s.email)}</td><td><button class="btn danger" onclick="removeItem('staff',${s.id})">Delete</button></td></tr>`)))+`<div id="staffEditor"></div><div class="notice">These are profile records only. This prototype does not create secure logins or enforce staff permissions.</div>`}
function staffForm(){document.getElementById('staffEditor').innerHTML=panel('Add staff profile',`<form onsubmit="saveSimple(event,'staff','staffEditor')"><div class="formgrid"><label>Full name<input name="name" required></label><label>Role<select name="role"><option>Teacher</option><option>Head of Year</option><option>Deputy Headteacher</option><option>Headteacher</option><option>Office Staff</option></select></label><label class="wide">Email<input name="email" type="email" placeholder="staff@example.test" required></label></div><div class="actions"><button class="btn">Save staff profile</button></div></form>`)}
function grades(){return header('Grades & reports','Record sample subject grades and report comments.',`<button class="btn" onclick="gradeForm()">＋ Add grade/report</button>`)+panel('Student reports',table(['Student','Subject','Grade','Report comment',''],data.grades.map(g=>`<tr><td>${esc(g.student)}</td><td>${esc(g.subject)}</td><td><span class="pill">${esc(g.grade)}</span></td><td>${esc(g.report)}</td><td><button class="btn danger" onclick="removeItem('grades',${g.id})">Delete</button></td></tr>`)))+`<div id="gradeEditor"></div>`}
function gradeForm(){document.getElementById('gradeEditor').innerHTML=panel('Add grade or report comment',`<form onsubmit="saveSimple(event,'grades','gradeEditor')"><div class="formgrid"><label>Student<select name="student">${data.students.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></label><label>Subject<input name="subject" required></label><label>Grade<select name="grade">${['A*','A','B','C','D','E','U','Working towards','Expected','Above expected'].map(g=>`<option>${g}</option>`).join('')}</select></label><label class="wide">Report comment<textarea name="report" rows="3" required></textarea></label></div><div class="actions"><button class="btn">Save report</button></div></form>`)}
function parents(){return header('Parent accounts','Link fictional parent contacts to students.',`<button class="btn" onclick="parentForm()">＋ Add parent</button>`)+panel('Parent directory',table(['Parent / carer','Student','Email',''],data.parents.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.student)}</td><td>${esc(p.email)}</td><td><button class="btn danger" onclick="removeItem('parents',${p.id})">Delete</button></td></tr>`)))+`<div id="parentEditor"></div><div class="notice">Parent entries are contact placeholders, not login accounts. Do not enter real family contact details in this demo.</div>`}
function parentForm(){document.getElementById('parentEditor').innerHTML=panel('Add parent / carer',`<form onsubmit="saveSimple(event,'parents','parentEditor')"><div class="formgrid"><label>Parent / carer name<input name="name" required></label><label>Linked student<select name="student">${data.students.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></label><label class="wide">Email<input name="email" type="email" placeholder="parent@example.test" required></label></div><div class="actions"><button class="btn">Save parent</button></div></form>`)}
function saveSimple(e,key,editor){e.preventDefault();data[key].push({id:Date.now(),...Object.fromEntries(new FormData(e.target))});save();render();toast('Record saved')}
function removeItem(key,id){if(!confirm('Delete this demo record?'))return;data[key]=data[key].filter(x=>x.id!==id);save();render();toast('Record deleted')}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='westfield-academy-demo-data.json';a.click();URL.revokeObjectURL(url)}
function resetData(){if(!confirm('Reset all demo records to the original sample data?'))return;data=JSON.parse(JSON.stringify(seed));save();render();toast('Demo reset')}
function render(){document.getElementById('sidebar').innerHTML=navHtml();document.getElementById('mobilebar').innerHTML=navHtml(true);const pages={dashboard,students,attendance,timetable,behaviour,staff,grades,parents};document.getElementById('main').innerHTML=pages[current]()+`<div class="footer">Westfield Academy · Roleplay portal · Demo data stored locally</div>`}
save();render();
</script>
</body>
</html>
